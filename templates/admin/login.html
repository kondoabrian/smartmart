<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | SmartMart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="smart-admin-login-body">


<div class="admin-login-page">

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">


                <!-- BRAND -->

                <div class="admin-login-brand text-center mb-4">

                    <div class="admin-brand-icon">
                        🛍️
                    </div>

                    <h1 class="admin-brand-name">
                        SmartMart
                    </h1>

                    <p class="admin-brand-subtitle">
                        Administration Panel
                    </p>

                </div>


                <!-- LOGIN CARD -->

                <div class="admin-login-card">


                    <div class="admin-login-card-header">

                        <div class="admin-login-lock">
                            🔐
                        </div>

                        <div>

                            <div class="admin-login-label">
                                SMARTMART ADMIN
                            </div>

                            <h2 class="admin-login-title">
                                Welcome Back
                            </h2>

                            <p class="admin-login-description">
                                Sign in to manage your SmartMart store.
                            </p>

                        </div>

                    </div>


                    <!-- ERROR -->

                    {% if error %}

                    <div class="admin-login-error">

                        <span class="admin-error-icon">
                            ⚠️
                        </span>

                        <div>

                            <strong>
                                Login Failed
                            </strong>

                            <p>
                                {{ error }}
                            </p>

                        </div>

                    </div>

                    {% endif %}


                    <!-- LOGIN FORM -->

                    <form
                        action="{{ url_for('admin_login') }}"
                        method="POST">


                        <div class="admin-form-group">

                            <label
                                for="username"
                                class="admin-form-label">

                                Username

                            </label>

                            <div class="admin-input-wrapper">

                                <span class="admin-input-icon">
                                    👤
                                </span>

                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="admin-form-input"
                                    placeholder="Enter your username"
                                    autocomplete="username"
                                    required>

                            </div>

                        </div>


                        <div class="admin-form-group">

                            <label
                                for="password"
                                class="admin-form-label">

                                Password

                            </label>

                            <div class="admin-input-wrapper">

                                <span class="admin-input-icon">
                                    🔒
                                </span>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="admin-form-input"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required>

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="admin-login-button">

                            <span>
                                🔐
                            </span>

                            Sign In to Admin Panel

                        </button>


                    </form>


                    <!-- BACK -->

                    <div class="admin-login-back">

                        <a
                            href="{{ url_for('home') }}"
                            class="admin-back-link">

                            ← Back to SmartMart

                        </a>

                    </div>


                </div>


                <!-- SECURITY NOTE -->

                <div class="admin-security-note">

                    <span>🛡️</span>

                    <span>
                        Authorized administration access only
                    </span>

                </div>


                <p class="admin-login-footer">
                    SmartMart • Smart Business. Better Future.
                </p>


            </div>

        </div>

    </div>

</div>


</body>

</html>
